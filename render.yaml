# Free Render compute; persistent data lives in external Supabase PostgreSQL.
# Use the contents of this AlphaVault directory as the repository root.
services:
  - type: web
    name: alphavault-sepolia
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: RPC_URL
        sync: false
      - key: DEPLOYMENT_FILE
        value: /app/config/sepolia-deployment.json
      - key: RECEIPT_SEED_FILE
        value: /app/config/sepolia-receipts.json
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_REQUIRED
        value: postgres
      - key: INDEX_INTERVAL_MS
        value: 60000
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
